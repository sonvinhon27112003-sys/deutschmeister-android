name: Build DeutschMeister Android APK

on:
  push:
    branches: [main]
    paths:
      - "deutschmeister-android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: deutschmeister-android/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: deutschmeister-android
        run: npm install

      - name: Build web app
        working-directory: deutschmeister-android
        run: npm run build

      - name: Generate Android project
        working-directory: deutschmeister-android
        run: npx cap add android

      - name: Sync web assets to Android
        working-directory: deutschmeister-android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: deutschmeister-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeutschMeister-Android-APK
          path: deutschmeister-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
